<!doctype html><title>Sample list page 2</title>
<main><h1>Sample list</h1><video-grid></video-grid><button class="next" type="button">Next</button></main>
<script>
  const pages = [[105, 106, 107], [108, 109, 110]];
  let pageNo = 0;
  class VideoGrid extends HTMLElement {
    connectedCallback() { this.attachShadow({ mode: 'open' }); setTimeout(() => this.draw(), 300); }
    draw() {
      this.shadowRoot.innerHTML = pages[pageNo].map((n) => '<a href="v/' + n + '.html"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Sample clip ' + n + '"><span>1:0' + (n % 10) + '</span></a>').join('');
    }
  }
  customElements.define('video-grid', VideoGrid);
  document.querySelector('.next').addEventListener('click', (e) => {
    pageNo += 1;
    document.querySelector('video-grid').draw();
    if (pageNo === pages.length - 1) e.target.remove();
  });
</script>
